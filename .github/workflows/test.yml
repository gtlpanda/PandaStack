# Runs every repo check (scripts/test.sh) on each pull request and on main.
# Branch protection on main requires this job ("test") to pass.
name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Tools the checks need
        run: |
          missing=()
          for t in shellcheck jq ip python3 unshare timeout; do command -v "$t" >/dev/null || missing+=("$t"); done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "installing for: ${missing[*]}"
            sudo apt-get update -q && sudo apt-get install -yq shellcheck jq iproute2 python3 util-linux coreutils
          fi
          node --version; git --version; shellcheck --version | sed -n 2p
      - name: scripts/test.sh
        run: scripts/test.sh
